domain_name: "Event Management"

actions:
  create_venue:
    description: "Creates a new venue, such as a conference room or auditorium, for events."
    parameters:
      name:
        description: "The unique name for the new venue. For example, 'Grand Ballroom' or 'Room 201'."
        clarification_prompt: "What would you like to name the new venue?"
      capacity:
        description: "The maximum number of people the venue can hold."
        clarification_prompt: "What is the maximum capacity of this venue?"
      has_av_system:
        description: "A boolean (true/false) indicating if the venue is equipped with an audio/visual system."
        clarification_prompt: "Does this venue have an A/V system? (yes/no)"

  modify_venue:
    description: "Modifies the properties of an existing venue, such as its capacity or A/V status."
    parameters:
      name:
        description: "The name of the existing venue to modify."
        clarification_prompt: "What is the name of the venue you want to modify?"
      capacity:
        description: "The new maximum number of people the venue can hold."
        clarification_prompt: "What is the new capacity for the venue?"
      has_av_system:
        description: "A boolean (true/false) indicating if the venue should now have an audio/visual system."
        clarification_prompt: "Should this venue now have an A/V system? (yes/no)"

  schedule_session:
    description: "Schedules a new session, talk, or presentation in one of the available venues."
    parameters:
      name:
        description: "The official title of the session."
        clarification_prompt: "What is the title of the session?"
      in_venue:
        description: "The name of the venue where the session will take place."
        clarification_prompt: "Which venue should this session be in? I can show you available options that fit your needs."
      expected_attendees:
        description: "The number of people expected to attend the session."
        clarification_prompt: "How many attendees are you expecting?"
      requires_av:
        description: "A boolean (true/false) indicating if the session requires an audio/visual system."
        clarification_prompt: "Does this session require A/V equipment? (yes/no)"
      hosted_by:
        description: "The name of the person or organization hosting the session."
        clarification_prompt: "Who will be hosting or presenting this session?"

  find_venue:
      description: "Searches for venues based on specified criteria."
      parameters:
        name_pattern:
          description: "Pattern to match in venue names (case-insensitive substring match)."
          clarification_prompt: "What pattern should I search for in venue names?"
        min_capacity:
          description: "Minimum capacity requirement."
          clarification_prompt: "What's the minimum capacity you need?"
        max_capacity:
          description: "Maximum capacity limit."
          clarification_prompt: "What's the maximum capacity you're looking for?"
        has_av_system:
          description: "Filter by A/V system availability (yes/no)."
          clarification_prompt: "Should the venues have an A/V system? (yes/no)"

  find_session:
      description: "Searches for sessions based on specified criteria."
      parameters:
        name_pattern:
          description: "Pattern to match in session names (case-insensitive substring match)."
          clarification_prompt: "What pattern should I search for in session names?"
        hosted_by_pattern:
          description: "Pattern to match in host names."
          clarification_prompt: "What pattern should I search for in host names?"
        in_venue:
          description: "The exact name of the venue where the session is taking place."
          clarification_prompt: "Which venue should I search in?"
        min_attendees:
          description: "Minimum number of expected attendees."
          clarification_prompt: "What's the minimum number of attendees?"
        max_attendees:
          description: "Maximum number of expected attendees."
          clarification_prompt: "What's the maximum number of attendees?"
        requires_av:
          description: "Filter by A/V requirement (yes/no)."
          clarification_prompt: "Should the sessions require A/V? (yes/no)"