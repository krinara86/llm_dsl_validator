# pytest.ini
[tool:pytest]
markers =
    llm_tests: Tests that require a real LLM (not run by default)
    slow: Tests that take a long time to run
    benchmark: Performance benchmark tests

# Default test paths
testpaths = tests

# Exclude LLM tests from default run
addopts = -m "not llm_tests"

# Minimum Python version
minversion = 3.8

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*